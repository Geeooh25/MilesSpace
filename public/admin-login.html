<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Miles Exchange | Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1f2e 0%, #2d3748 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .admin-login-container {
            max-width: 450px;
            width: 100%;
        }

        .admin-login-card {
            background: white;
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .admin-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .admin-logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary, #D9A24C), #b8860b);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }

        .admin-logo-icon i {
            font-size: 32px;
            color: white;
        }

        .admin-logo h2 {
            font-size: 24px;
            color: #1a1f2e;
        }

        .admin-logo p {
            font-size: 14px;
            color: #6b7284;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e4e9f0;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #D9A24C;
            box-shadow: 0 0 0 3px rgba(217, 162, 76, 0.1);
        }

        .login-btn {
            width: 100%;
            background: #D9A24C;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .login-btn:hover {
            background: #b8860b;
            transform: translateY(-1px);
        }

        .message {
            margin-bottom: 20px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
        }

        .message-error {
            background: #fef2f2;
            border-left: 3px solid #dc2626;
            color: #991b1b;
        }

        .message-success {
            background: #ecfdf5;
            border-left: 3px solid #059669;
            color: #065f46;
        }

        .back-link {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
        }

        .back-link a {
            color: #D9A24C;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .divider {
            margin: 24px 0;
            text-align: center;
            position: relative;
            border-top: 1px solid #e4e9f0;
        }

        .divider span {
            background: white;
            padding: 0 12px;
            position: relative;
            top: -11px;
            font-size: 12px;
            color: #6b7284;
        }
    </style>
</head>
<body>
<div class="admin-login-container">
    <div class="admin-login-card">
        <div class="admin-logo">
            <div class="admin-logo-icon">
                <i class="fas fa-crown"></i>
            </div>
            <h2>Admin Portal</h2>
            <p>Secure access for administrators only</p>
        </div>

        <div id="messageBox"></div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Admin Email</label>
                <input type="email" id="adminEmail" placeholder="admin@milesexchange.com" autocomplete="off">
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Admin Password</label>
                <input type="password" id="adminPassword" placeholder="••••••••">
            </div>
            <button type="submit" class="login-btn">
                <i class="fas fa-sign-in-alt"></i> Access Admin Panel
            </button>
        </form>

        <div class="divider">
            <span>or</span>
        </div>

        <div class="back-link">
            <a href="signup.html">← Back to User Login</a>
        </div>
    </div>
</div>

<script>
    // Admin credentials (hardcoded for security)
    const ADMIN_CREDENTIALS = {
        email: 'admin@milesexchange.com',
        password: 'admin123'
    };

    // Optional: Additional admin accounts
    const ADDITIONAL_ADMINS = [
        { email: 'superadmin@milesexchange.com', password: 'super123' },
        { email: 'support@milesexchange.com', password: 'support123' }
    ];

    function showMessage(message, isError = true) {
        const msgDiv = document.getElementById('messageBox');
        msgDiv.innerHTML = `<div class="message ${isError ? 'message-error' : 'message-success'}">${message}</div>`;
        setTimeout(() => {
            if (msgDiv.innerHTML.includes(message)) msgDiv.innerHTML = '';
        }, 3000);
    }

    function checkAdminCredentials(email, password) {
        // Check main admin
        if (email === ADMIN_CREDENTIALS.email && password === ADMIN_CREDENTIALS.password) {
            return true;
        }
        
        // Check additional admins
        for (let admin of ADDITIONAL_ADMINS) {
            if (email === admin.email && password === admin.password) {
                return true;
            }
        }
        
        return false;
    }

    document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        
        const email = document.getElementById('adminEmail').value.trim();
        const password = document.getElementById('adminPassword').value;
        
        if (!email || !password) {
            showMessage('Please enter both email and password.', true);
            return;
        }
        
        if (checkAdminCredentials(email, password)) {
            // Create admin session
            const adminSession = {
                isAdmin: true,
                email: email,
                name: 'Administrator',
                loggedAt: Date.now()
            };
            
            // Store admin session (separate from user session)
            localStorage.setItem('admin_session', JSON.stringify(adminSession));
            
            showMessage('Login successful! Redirecting to admin panel...', false);
            
            setTimeout(() => {
                window.location.href = 'admin.html';
            }, 1000);
        } else {
            showMessage('Invalid admin credentials. Access denied.', true);
        }
    });
</script>
</body>
</html>
