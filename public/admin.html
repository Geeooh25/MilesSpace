<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin · Manage Orders</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #1a1f2e;
            color: #fff;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; flex-wrap: wrap; gap: 16px; }
        .header h1 { font-size: 1.8rem; display: flex; align-items: center; gap: 12px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .stat-card { background: rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; text-align: center; backdrop-filter: blur(10px); }
        .stat-number { font-size: 2rem; font-weight: 800; color: #D9A24C; }
        .orders-table { background: rgba(255,255,255,0.05); border-radius: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 16px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { background: rgba(217,162,76,0.2); font-weight: 600; }
        .status-select { padding: 6px 12px; border-radius: 20px; border: none; font-weight: 600; cursor: pointer; }
        .status-pending { background: #f59e0b; color: #fff; }
        .status-processing { background: #3b82f6; color: #fff; }
        .status-completed { background: #10b981; color: #fff; }
        .status-cancelled { background: #ef4444; color: #fff; }
        button { background: var(--primary, #D9A24C); border: none; padding: 8px 16px; border-radius: 40px; color: white; font-weight: 600; cursor: pointer; }
        .service-form { background: rgba(255,255,255,0.1); border-radius: 20px; padding: 24px; margin-top: 32px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; margin-top: 16px; }
        .form-grid input, .form-grid select { padding: 12px; border-radius: 12px; border: none; background: rgba(255,255,255,0.2); color: white; }
        .form-grid input::placeholder { color: rgba(255,255,255,0.5); }
        @media (max-width: 768px) { .container { padding: 16px; } th, td { padding: 10px; font-size: 12px; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-crown" style="color: #D9A24C;"></i> Admin Dashboard</h1>
        <button onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
    
    <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><div class="stat-number" id="totalOrders">0</div><div>Total Orders</div></div>
        <div class="stat-card"><div class="stat-number" id="pendingOrders">0</div><div>Pending</div></div>
        <div class="stat-card"><div class="stat-number" id="completedOrders">0</div><div>Completed</div></div>
        <div class="stat-card"><div class="stat-number" id="totalRevenue">₦0</div><div>Revenue</div></div>
    </div>
    
    <div class="orders-table">
        <table>
            <thead><tr><th>ID</th><th>User</th><th>Service</th><th>Link</th><th>Qty</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead>
            <tbody id="ordersBody"></tbody>
        </table>
    </div>
    
    <div class="service-form">
        <h3><i class="fas fa-plus-circle"></i> Add New Service</h3>
        <div class="form-grid">
            <input type="text" id="serviceName" placeholder="Service Name (e.g., Instagram Followers)">
            <select id="servicePlatform"><option value="instagram">Instagram</option><option value="tiktok">TikTok</option><option value="twitter">Twitter/X</option><option value="facebook">Facebook</option></select>
            <input type="number" id="servicePrice" placeholder="Price per unit (₦)">
            <input type="text" id="serviceIcon" placeholder="Icon (e.g., fab fa-instagram)">
            <button onclick="addService()"><i class="fas fa-save"></i> Add Service</button>
        </div>
    </div>
</div>
<script>
    const API_BASE = 'http://localhost:5000/api';
    let token = localStorage.getItem('adminToken') || sessionStorage.getItem('adminToken');
    
    if (!token) { window.location.href = 'admin-login.html'; }
    
    async function loadOrders() {
        const res = await fetch(`${API_BASE}/admin/orders`, { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        if (data.success) {
            document.getElementById('ordersBody').innerHTML = data.orders.map(order => `
                <tr>
                    <td>#${order.id}</td><td>${order.user_email}</td><td>${order.service_name}</td>
                    <td style="max-width:200px;overflow:hidden">${order.link}</td>
                    <td>${order.quantity}</td><td>₦${order.total_amount}</td>
                    <td><select class="status-select status-${order.status}" onchange="updateStatus(${order.id}, this.value)"><option ${order.status==='pending'?'selected':''}>pending</option><option ${order.status==='processing'?'selected':''}>processing</option><option ${order.status==='completed'?'selected':''}>completed</option><option ${order.status==='cancelled'?'selected':''}>cancelled</option></select></td>
                    <td><button onclick="deleteOrder(${order.id})"><i class="fas fa-trash"></i></button></td>
                </tr>
            `).join('');
            document.getElementById('totalOrders').innerText = data.stats.total;
            document.getElementById('pendingOrders').innerText = data.stats.pending;
            document.getElementById('completedOrders').innerText = data.stats.completed;
            document.getElementById('totalRevenue').innerText = `₦${data.stats.revenue}`;
        }
    }
    
    async function updateStatus(orderId, status) {
        await fetch(`${API_BASE}/admin/order/${orderId}/status`, {
            method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ status })
        });
        loadOrders();
    }
    
    async function addService() {
        const name = document.getElementById('serviceName').value;
        const platform = document.getElementById('servicePlatform').value;
        const price = parseFloat(document.getElementById('servicePrice').value);
        const icon = document.getElementById('serviceIcon').value;
        if (!name || !price) return alert('Fill required fields');
        await fetch(`${API_BASE}/admin/services`, {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ name, platform, price_per_unit: price, icon })
        });
        alert('Service added'); location.reload();
    }
    
    async function deleteOrder(id) {
        if (confirm('Delete this order?')) {
            await fetch(`${API_BASE}/admin/order/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
            loadOrders();
        }
    }
    
    function logout() { localStorage.clear(); sessionStorage.clear(); window.location.href = 'admin-login.html'; }
    
    loadOrders();
</script>
</body>
</html>
