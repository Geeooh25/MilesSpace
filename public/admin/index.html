<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MilesSpace — Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="/js/admin-session.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: #fff;
            border-radius: 20px;
            padding: 40px 48px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 16px 48px -12px rgba(8, 42, 51, 0.26);
        }
        .login-container .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-container .logo h1 {
            font-size: 28px;
            font-weight: 800;
            color: #0c3d4a;
            letter-spacing: -0.02em;
        }
        .login-container .logo h1 span {
            color: #f59e0b;
        }
        .login-container .logo p {
            color: #5b7480;
            font-size: 14px;
            margin-top: 4px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #0c1f26;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(12, 61, 74, 0.12);
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #f8fafb;
        }
        .form-group input:focus {
            outline: none;
            border-color: #0c3d4a;
            box-shadow: 0 0 0 3px rgba(12, 61, 74, 0.1);
            background: #fff;
        }
        .form-group input::placeholder {
            color: #8fa3ab;
        }
        .form-group .input-icon {
            position: relative;
        }
        .form-group .input-icon i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #8fa3ab;
            font-size: 14px;
        }
        .form-group .input-icon input {
            padding-left: 42px;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #0c3d4a;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-login:hover {
            background: #12556a;
        }
        .btn-login:active {
            transform: scale(0.98);
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error-message {
            background: #fdecec;
            color: #dc2626;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            border-left: 3px solid #dc2626;
        }
        .error-message.show {
            display: block;
        }
        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #5b7480;
        }
        .login-footer a {
            color: #0c3d4a;
            font-weight: 600;
            text-decoration: none;
        }
        .login-footer a:hover {
            text-decoration: underline;
        }
        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #8fa3ab;
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
        }
        .password-toggle:hover {
            color: #0c3d4a;
        }
        @media (max-width: 480px) {
            .login-container {
                padding: 28px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>Miles<span>Space</span></h1>
            <p>Admin Intelligence Portal</p>
        </div>

        <div class="error-message" id="errorMessage">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText">Invalid credentials</span>
        </div>

        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="admin@example.com" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span id="loginBtnText">Sign In</span>
                <span id="loginBtnIcon"><i class="fas fa-arrow-right"></i></span>
            </button>
        </form>

        <div class="login-footer">
            Secure admin access only · <a href="/">Back to site</a>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ─── DOM Elements ──────────────────────────────────────────
            const form = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const loginBtnText = document.getElementById('loginBtnText');
            const loginBtnIcon = document.getElementById('loginBtnIcon');
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const passwordToggle = document.getElementById('passwordToggle');

            // ─── Password Toggle ──────────────────────────────────────
            let passwordVisible = false;
            passwordToggle.addEventListener('click', () => {
                passwordVisible = !passwordVisible;
                passwordInput.type = passwordVisible ? 'text' : 'password';
                passwordToggle.innerHTML = `<i class="fas fa-${passwordVisible ? 'eye-slash' : 'eye'}"></i>`;
            });

            // ─── Show/Hide Error ──────────────────────────────────────
            function showError(message) {
                errorText.textContent = message;
                errorMessage.classList.add('show');
            }

            function hideError() {
                errorMessage.classList.remove('show');
            }

            // ─── Set Loading State ────────────────────────────────────
            function setLoading(isLoading) {
                if (isLoading) {
                    loginBtn.disabled = true;
                    loginBtnText.textContent = 'Signing In...';
                    loginBtnIcon.innerHTML = '<span class="loading-spinner"></span>';
                } else {
                    loginBtn.disabled = false;
                    loginBtnText.textContent = 'Sign In';
                    loginBtnIcon.innerHTML = '<i class="fas fa-arrow-right"></i>';
                }
            }

            // ─── Admin Login ───────────────────────────────────────────
            async function handleLogin(e) {
                e.preventDefault();
                hideError();

                const email = emailInput.value.trim();
                const password = passwordInput.value;

                if (!email || !password) {
                    showError('Please enter both email and password');
                    return;
                }

                setLoading(true);

                try {
                    // ✅ CORRECT: Use /api/admin/login
                    const response = await fetch('/api/admin/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    });

                    const data = await response.json();

                    if (!response.ok || !data.success) {
                        throw new Error(data.error || data.message || 'Login failed');
                    }

                    const { token, user, refreshToken } = data.data || {};

                    if (!token) {
                        throw new Error('Server did not return an authentication token');
                    }

                    console.log('✅ Login successful, saving session...');

                    // ─── Save session using AdminSession ──────────────
                    if (typeof window.AdminSession !== 'undefined' && window.AdminSession.save) {
                        window.AdminSession.save(token, user, refreshToken);
                        console.log('✅ Admin session saved via AdminSession');
                    } else {
                        // Fallback: save directly
                        const session = {
                            token: token,
                            refreshToken: refreshToken || null,
                            user: user || null,
                            loggedAt: Date.now()
                        };
                        localStorage.setItem('admin_sess', JSON.stringify(session));
                        console.log('✅ Admin session saved (fallback)');
                    }

                    // ─── Redirect to dashboard ─────────────────────────
                    const dashboardUrl = data.data?.dashboardUrl || '/admin/dashboard.html';
                    console.log('🔄 Redirecting to:', dashboardUrl);
                    
                    // Small delay to ensure session is saved
                    setTimeout(() => {
                        window.location.replace(dashboardUrl);
                    }, 200);

                } catch (error) {
                    console.error('Login error:', error);
                    showError(error.message || 'Invalid email or password. Please try again.');
                    setLoading(false);
                }
            }

            // ─── Event Listeners ──────────────────────────────────────
            form.addEventListener('submit', handleLogin);

            // Clear error on input
            emailInput.addEventListener('input', hideError);
            passwordInput.addEventListener('input', hideError);

            // ─── Check if already logged in ──────────────────────────
            function checkExistingSession() {
                try {
                    const session = localStorage.getItem('admin_sess');
                    if (session) {
                        const parsed = JSON.parse(session);
                        if (parsed.token) {
                            // Check if token is expired
                            try {
                                const parts = parsed.token.split('.');
                                if (parts.length === 3) {
                                    let payload = parts[1].replace(/-/g, '+').replace(/_/g, '/');
                                    while (payload.length % 4) payload += '=';
                                    const decoded = JSON.parse(atob(payload));
                                    if (decoded.exp && decoded.exp * 1000 > Date.now()) {
                                        console.log('✅ Valid session found, redirecting to dashboard');
                                        window.location.replace('/admin/dashboard.html');
                                        return;
                                    }
                                }
                            } catch (e) {
                                // Invalid token, clear it
                                localStorage.removeItem('admin_sess');
                            }
                        }
                    }
                } catch (e) {
                    // Ignore
                }
            }

            // Run session check after a small delay
            setTimeout(checkExistingSession, 300);

            console.log('🔐 Admin Login Page loaded');
            console.log('📍 Login endpoint: /api/admin/login');
            console.log('📄 Dashboard: /admin/dashboard.html');

        })();
    </script>
</body>
</html>
