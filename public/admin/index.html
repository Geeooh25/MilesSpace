

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=yes"/>
<title>Admin Login | MilesSpace</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
/* ─── ALL YOUR EXISTING STYLES ─── */
:root {
  --p:#0c3d4a;
  --pm:#155e72;
  --pl:#e8f4f7;
  --acc:#f59e0b;
  --acd:#d97706;
  --ok:#10b981;
  --err:#ef4444;
  --bg:#edf1f4;
  --srf:#fff;
  --bdr:#dde4e9;
  --t1:#0a2530;
  --t2:#456475;
  --t3:#8aa4ae;
  --r:12px;
  --rl:18px;
  --rxl:24px;
  --rp:999px;
  --fd:'Syne',sans-serif;
  --fb:'DM Sans',sans-serif;
}
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
}
body {
  font-family:var(--fb);
  background:var(--bg);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.login-container {
  background:var(--srf);
  border-radius:var(--rxl);
  padding:40px 36px;
  max-width:420px;
  width:100%;
  box-shadow:0 20px 60px rgba(10,37,48,.12);
  border:1px solid var(--bdr);
}
.admin-badge {
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--pl);
  color:var(--p);
  padding:4px 14px;
  border-radius:var(--rp);
  font-size:.7rem;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.06em;
  margin-bottom:14px;
}
.admin-badge i {
  font-size:.65rem;
}
.logo {
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:20px;
}
.logo img {
  width:36px;
  height:36px;
  border-radius:8px;
}
.logo h1 {
  font-family:var(--fd);
  font-size:1.2rem;
  font-weight:800;
  color:var(--t1);
}
.logo span {
  color:var(--t3);
  font-weight:400;
  font-size:.85rem;
}
.title {
  font-family:var(--fd);
  font-size:1.5rem;
  font-weight:800;
  color:var(--t1);
  margin-bottom:4px;
}
.subtitle {
  font-size:.85rem;
  color:var(--t3);
  margin-bottom:24px;
}
.alert {
  padding:10px 14px;
  border-radius:var(--r);
  font-size:.8rem;
  font-weight:500;
  display:none;
  align-items:center;
  gap:8px;
  margin-bottom:16px;
}
.alert.show {
  display:flex;
}
.alert.err {
  background:#fee2e2;
  border:1px solid #fca5a5;
  color:#991b1b;
}
.alert.ok {
  background:#d1fae5;
  border:1px solid #a7f3d0;
  color:#065f46;
}
.fg {
  margin-bottom:16px;
}
.flbl {
  display:block;
  font-size:.7rem;
  font-weight:700;
  color:var(--t2);
  margin-bottom:5px;
  text-transform:uppercase;
  letter-spacing:.04em;
}
.inp-wrap {
  position:relative;
}
.inp-wrap i {
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  color:var(--t3);
  font-size:.85rem;
}
.finp {
  width:100%;
  padding:10px 14px 10px 38px;
  border:1.5px solid var(--bdr);
  border-radius:var(--r);
  font-size:.9rem;
  color:var(--t1);
  background:#f7f9fb;
  outline:none;
  transition:all .2s;
}
.finp:focus {
  border-color:var(--p);
  background:var(--srf);
  box-shadow:0 0 0 3px rgba(12,61,74,.07);
}
.finp.err-inp {
  border-color:var(--err);
}
.eye-btn {
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  background:none;
  border:none;
  color:var(--t3);
  cursor:pointer;
  font-size:.85rem;
}
.btn-primary {
  width:100%;
  padding:12px;
  background:var(--p);
  color:#fff;
  border:none;
  border-radius:var(--rp);
  font-family:var(--fd);
  font-weight:700;
  font-size:.9rem;
  cursor:pointer;
  transition:all .22s;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
.btn-primary:hover {
  background:var(--pm);
  transform:translateY(-1px);
  box-shadow:0 4px 14px rgba(12,61,74,.22);
}
.btn-primary:disabled {
  opacity:.5;
  cursor:not-allowed;
  transform:none!important;
}
.footer-links {
  display:flex;
  justify-content:space-between;
  margin-top:16px;
  font-size:.78rem;
}
.footer-links a {
  color:var(--t2);
  text-decoration:none;
  transition:color .2s;
}
.footer-links a:hover {
  color:var(--p);
}
.security-badge {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  margin-top:20px;
  font-size:.7rem;
  color:var(--t3);
}
.security-badge i {
  color:var(--ok);
}
@media(max-width:480px) {
  .login-container {
    padding:28px 20px;
  }
  .title {
    font-size:1.25rem;
  }
}
</style>
</head>
<body>

<div class="login-container">
  <div class="admin-badge">
    <i class="fas fa-shield-alt"></i>
    Admin Access
  </div>

  <div class="logo">
    <img src="/images/miles.png" alt="MilesSpace"/>
    <div>
      <h1>MilesSpace <span>Admin</span></h1>
    </div>
  </div>

  <h2 class="title">Welcome Back</h2>
  <p class="subtitle">Sign in to your admin dashboard</p>

  <div class="alert" id="loginAlert"></div>

  <form id="loginForm" novalidate>
    <div class="fg">
      <label class="flbl">Email Address</label>
      <div class="inp-wrap">
        <i class="fas fa-envelope"></i>
        <input type="email" class="finp" id="email" placeholder="admin@miles.com" autocomplete="email"/>
      </div>
    </div>

    <div class="fg">
      <label class="flbl">Password</label>
      <div class="inp-wrap">
        <i class="fas fa-lock"></i>
        <input type="password" class="finp" id="password" placeholder="············" autocomplete="current-password"/>
        <button type="button" class="eye-btn" onclick="togglePassword()">
          <i class="fas fa-eye" id="eyeIcon"></i>
        </button>
      </div>
    </div>

    <button type="submit" class="btn-primary" id="loginBtn">
      <i class="fas fa-arrow-right"></i> Sign In
    </button>
  </form>

  <div class="footer-links">
    <a href="/">← Back to Home</a>
    <a href="#" id="forgotLink">Forgot Password?</a>
  </div>

  <div class="security-badge">
    <i class="fas fa-lock"></i>
    <span>Secure admin access · Role-based authentication</span>
  </div>
</div>

<script>
'use strict';

const API_BASE = '/api/admin';
const SESSION_KEY = 'admin_sess';

function togglePassword() {
  const inp = document.getElementById('password');
  const icon = document.getElementById('eyeIcon');
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  icon.className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
}

function showAlert(msg, type = 'err') {
  const el = document.getElementById('loginAlert');
  el.className = `alert show ${type}`;
  el.innerHTML = `<i class="fas ${type === 'ok' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i><span>${msg}</span>`;
  if (type === 'ok') setTimeout(() => hideAlert(), 5000);
}

function hideAlert() {
  const el = document.getElementById('loginAlert');
  el.className = 'alert';
  el.innerHTML = '';
}

// ─── CHECK IF ALREADY LOGGED IN ───
(function checkAdminSession() {
  try {
    const sess = JSON.parse(localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY) || 'null');
    if (sess?.token) {
      // Verify token is still valid
      fetch(`${API_BASE}/verify`, {
        headers: { 'Authorization': `Bearer ${sess.token}` }
      })
      .then(res => {
        if (res.ok) {
          window.location.href = '/admin/dashboard';
        } else {
          // Token invalid, clear it
          localStorage.removeItem(SESSION_KEY);
          sessionStorage.removeItem(SESSION_KEY);
        }
      })
      .catch(() => {
        // If verify fails, clear session
        localStorage.removeItem(SESSION_KEY);
        sessionStorage.removeItem(SESSION_KEY);
      });
    }
  } catch (e) {
    localStorage.removeItem(SESSION_KEY);
    sessionStorage.removeItem(SESSION_KEY);
  }
})();

// ─── LOGIN FORM ───
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');

  if (!email || !password) {
    showAlert('Please enter your email and password.', 'err');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in…';
  hideAlert();

  try {
    const response = await fetch(`${API_BASE}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    const data = await response.json();

    if (response.ok && data.success) {
      const sessData = JSON.stringify({
        token: data.data.token,
        user: data.data.user,
        isAdmin: true,
        loggedAt: Date.now()
      });
      localStorage.setItem(SESSION_KEY, sessData);
      
      showAlert('✅ Welcome, Admin! Redirecting…', 'ok');
      setTimeout(() => {
        window.location.href = '/admin/dashboard';
      }, 800);
    } else {
      showAlert(data.error || 'Login failed. Please check your credentials.', 'err');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-arrow-right"></i> Sign In';
    }
  } catch (err) {
    console.error('Login error:', err);
    showAlert('Could not connect to server. Please try again.', 'err');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-arrow-right"></i> Sign In';
  }
});

document.getElementById('forgotLink').addEventListener('click', (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  if (!email) {
    showAlert('Enter your email address first, then click Forgot password.', 'err');
    return;
  }
  showAlert('Password reset link sent to your email.', 'ok');
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const form = document.getElementById('loginForm');
    if (document.activeElement === document.getElementById('email') || 
        document.activeElement === document.getElementById('password')) {
      form.dispatchEvent(new Event('submit'));
    }
  }
});
</script>
</body>
</html>
