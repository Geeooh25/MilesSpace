<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MilesSpace — Admin Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="/js/admin-session.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f4f7fb;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-container{background:#fff;border-radius:20px;padding:40px 48px;max-width:440px;width:100%;box-shadow:0 16px 48px -12px rgba(8,42,51,.26)}
.logo{text-align:center;margin-bottom:28px}
.logo h1{font-size:28px;font-weight:800;color:#0c3d4a;letter-spacing:-.02em}
.logo h1 span{color:#f59e0b}
.logo p{color:#5b7480;font-size:14px;margin-top:4px}
.step{display:none}
.step.active{display:block}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:13px;font-weight:600;color:#0c1f26;margin-bottom:6px}
.form-group input{width:100%;padding:12px 16px;border:1px solid rgba(12,61,74,.12);border-radius:10px;font-size:14px;transition:border-color .2s,box-shadow .2s;background:#f8fafb}
.form-group input:focus{outline:none;border-color:#0c3d4a;box-shadow:0 0 0 3px rgba(12,61,74,.1);background:#fff}
.form-group input::placeholder{color:#8fa3ab}
.input-icon{position:relative}
.input-icon i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#8fa3ab;font-size:14px}
.input-icon input{padding-left:42px}
.btn-login{width:100%;padding:14px;background:#0c3d4a;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:background .2s,transform .1s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-login:hover{background:#12556a}
.btn-login:active{transform:scale(.98)}
.btn-login:disabled{opacity:.6;cursor:not-allowed}
.error-message{background:#fdecec;color:#dc2626;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none;border-left:3px solid #dc2626}
.error-message.show{display:block}
.info-message{background:#e8f1fb;color:#2563a8;padding:12px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;border-left:3px solid #2563a8;line-height:1.5}
.loading-spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.login-footer{text-align:center;margin-top:24px;font-size:13px;color:#5b7480}
.login-footer a{color:#0c3d4a;font-weight:600;text-decoration:none}
.login-footer a:hover{text-decoration:underline}
.password-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:#8fa3ab;cursor:pointer;font-size:14px;padding:4px}
.password-toggle:hover{color:#0c3d4a}
.mfa-code-input{width:100%;padding:16px;border:2px solid rgba(12,61,74,.14);border-radius:12px;font-size:24px;font-weight:700;letter-spacing:.35em;text-align:center;font-family:'JetBrains Mono',monospace;background:#f8fafb;color:#0c3d4a;text-transform:uppercase}
.mfa-code-input:focus{outline:none;border-color:#0c3d4a;box-shadow:0 0 0 4px rgba(12,61,74,.08);background:#fff}
.mfa-code-input.recovery-mode{font-size:16px;letter-spacing:.15em}
.mfa-step-title{font-size:18px;font-weight:700;color:#0c3d4a;text-align:center;margin-bottom:6px}
.mfa-step-sub{font-size:13px;color:#5b7480;text-align:center;margin-bottom:12px;line-height:1.5}
.mfa-timer{font-size:12px;color:#8fa3ab;text-align:center;margin-bottom:16px;font-family:'JetBrains Mono',monospace}
.mfa-timer.warn{color:#dc2626;font-weight:600}
.mfa-link{background:none;border:none;color:#0c3d4a;font-weight:600;font-size:12.5px;text-decoration:underline;cursor:pointer;padding:6px 0}
.mfa-link:hover{color:#12556a}
.mfa-actions{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
@media (max-width:480px){
    body{padding:12px}
    .login-container{padding:28px 22px;border-radius:16px}
    .logo h1{font-size:24px}
    .mfa-code-input{font-size:20px;letter-spacing:.3em;padding:14px}
    .mfa-code-input.recovery-mode{font-size:14px;letter-spacing:.08em}
}
</style>
</head>
<body>
<div class="login-container">
    <div class="logo">
        <h1>Miles<span>Space</span></h1>
        <p>Admin Intelligence Portal</p>
    </div>

    <div class="error-message" id="errorMessage">
        <i class="fas fa-exclamation-circle"></i>
        <span id="errorText">Something went wrong</span>
    </div>

    <!-- ═══ STEP 1 — password ═══ -->
    <div class="step active" id="stepPassword">
        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="admin@example.com" required autofocus>
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">
                <span id="loginBtnText">Sign In</span>
                <span id="loginBtnIcon"><i class="fas fa-arrow-right"></i></span>
            </button>
        </form>
    </div>

    <!-- ═══ STEP 2 — MFA code ═══ -->
    <div class="step" id="stepMfa">
        <div class="mfa-step-title"><i class="fas fa-shield-halved" style="color:#f59e0b"></i> Two-factor verification</div>
        <div class="mfa-step-sub" id="mfaStepSub">Enter the 6-digit code from your authenticator app.</div>
        <div class="mfa-timer" id="mfaTimer">Code expires in 03:00</div>

        <form id="mfaForm" autocomplete="off">
            <div class="form-group">
                <input type="text" id="mfaCode" class="mfa-code-input"
                       inputmode="text" maxlength="6"
                       placeholder="••••••" autocomplete="one-time-code" required>
            </div>
            <button type="submit" class="btn-login" id="mfaBtn">
                <span id="mfaBtnText">Verify &amp; Sign In</span>
                <span id="mfaBtnIcon"><i class="fas fa-arrow-right"></i></span>
            </button>
        </form>

        <div class="mfa-actions">
            <button type="button" class="mfa-link" id="mfaUseRecovery">Use recovery code</button>
            <button type="button" class="mfa-link" id="mfaBack">← Back to sign in</button>
        </div>
    </div>

    <div class="login-footer">
        Secure admin access only · <a href="/">Back to site</a>
    </div>
</div>

<script>
(function () {
    'use strict';

    // ─── DOM ─────────────────────────────────────────────────
    const stepPassword   = document.getElementById('stepPassword');
    const stepMfa        = document.getElementById('stepMfa');
    const form           = document.getElementById('loginForm');
    const mfaForm        = document.getElementById('mfaForm');
    const emailInput     = document.getElementById('email');
    const passwordInput  = document.getElementById('password');
    const mfaCodeInput   = document.getElementById('mfaCode');
    const mfaBtn         = document.getElementById('mfaBtn');
    const mfaBtnText     = document.getElementById('mfaBtnText');
    const mfaBtnIcon     = document.getElementById('mfaBtnIcon');
    const loginBtn       = document.getElementById('loginBtn');
    const loginBtnText   = document.getElementById('loginBtnText');
    const loginBtnIcon   = document.getElementById('loginBtnIcon');
    const errorMessage   = document.getElementById('errorMessage');
    const errorText      = document.getElementById('errorText');
    const passwordToggle = document.getElementById('passwordToggle');
    const mfaBack        = document.getElementById('mfaBack');
    const mfaUseRecovery = document.getElementById('mfaUseRecovery');
    const mfaStepSub     = document.getElementById('mfaStepSub');
    const mfaTimer       = document.getElementById('mfaTimer');

    let passwordVisible = false;
    let usingRecovery   = false;
    let mfaToken        = null;
    let countdownTimer  = null;
    let secondsLeft     = 180; // 3 minutes, matches backend challenge expiry

    // ─── Password toggle ────────────────────────────────────
    passwordToggle.addEventListener('click', () => {
        passwordVisible = !passwordVisible;
        passwordInput.type = passwordVisible ? 'text' : 'password';
        passwordToggle.innerHTML = `<i class="fas fa-${passwordVisible ? 'eye-slash' : 'eye'}"></i>`;
    });

    // ─── Show/hide error ────────────────────────────────────
    function showError(msg) {
        errorText.textContent = msg;
        errorMessage.classList.add('show');
    }
    function hideError() { errorMessage.classList.remove('show'); }

    // ─── Loading state ──────────────────────────────────────
    function setLoading(btn, textEl, iconEl, isLoading, defaultLabel) {
        if (isLoading) {
            btn.disabled = true;
            textEl.textContent = 'Please wait…';
            iconEl.innerHTML = '<span class="loading-spinner"></span>';
        } else {
            btn.disabled = false;
            textEl.textContent = defaultLabel;
            iconEl.innerHTML = '<i class="fas fa-arrow-right"></i>';
        }
    }

    // ─── Countdown ──────────────────────────────────────────
    function startCountdown() {
        stopCountdown();
        secondsLeft = 180;
        updateTimerDisplay();
        countdownTimer = setInterval(() => {
            secondsLeft -= 1;
            updateTimerDisplay();
            if (secondsLeft <= 0) {
                stopCountdown();
                showError('Your verification session expired. Please sign in again.');
                setTimeout(() => {
                    mfaToken = null;
                    usingRecovery = false;
                    showPasswordStep();
                }, 1500);
            }
        }, 1000);
    }
    function stopCountdown() {
        if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
    }
    function updateTimerDisplay() {
        if (secondsLeft <= 0) {
            mfaTimer.textContent = 'Expired';
            mfaTimer.classList.add('warn');
            return;
        }
        const m = Math.floor(secondsLeft / 60);
        const s = secondsLeft % 60;
        mfaTimer.textContent = `Code expires in ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        mfaTimer.classList.toggle('warn', secondsLeft <= 30);
    }

    // ─── Recovery-mode toggle ───────────────────────────────
    function setRecoveryMode(on) {
        usingRecovery = on;
        mfaCodeInput.value = '';
        if (on) {
            mfaStepSub.textContent = 'Enter one of your saved recovery codes (format: XXXX-XXXX-XX).';
            mfaCodeInput.maxLength = 20;
            mfaCodeInput.placeholder = 'XXXX-XXXX-XX';
            mfaCodeInput.classList.add('recovery-mode');
            mfaCodeInput.setAttribute('inputmode', 'text');
            mfaUseRecovery.textContent = 'Use authenticator code';
        } else {
            mfaStepSub.textContent = 'Enter the 6-digit code from your authenticator app.';
            mfaCodeInput.maxLength = 6;
            mfaCodeInput.placeholder = '••••••';
            mfaCodeInput.classList.remove('recovery-mode');
            mfaCodeInput.setAttribute('inputmode', 'numeric');
            mfaUseRecovery.textContent = 'Use recovery code';
        }
        mfaCodeInput.focus();
    }

    // ─── Step transitions ───────────────────────────────────
    function showPasswordStep() {
        stopCountdown();
        stepMfa.classList.remove('active');
        stepPassword.classList.add('active');
        hideError();
        mfaCodeInput.value = '';
        setRecoveryMode(false);
        emailInput.focus();
    }
    function showMfaStep() {
        stepPassword.classList.remove('active');
        stepMfa.classList.add('active');
        hideError();
        mfaCodeInput.value = '';
        setRecoveryMode(false);
        startCountdown();
        mfaCodeInput.focus();
    }

    // ─── Step 1: login ──────────────────────────────────────
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideError();
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        if (!email || !password) { showError('Please enter both email and password'); return; }

        setLoading(loginBtn, loginBtnText, loginBtnIcon, true);

        try {
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json().catch(() => ({}));

            if (!res.ok || !data.success) {
                throw new Error(data.error || data.message || 'Login failed');
            }

            if (data.data?.mfa_required) {
                mfaToken = data.data.mfa_token;
                setLoading(loginBtn, loginBtnText, loginBtnIcon, false, 'Sign In');
                showMfaStep();
                return;
            }

            completeLogin(data.data);
        } catch (err) {
            showError(err.message || 'Invalid email or password.');
            setLoading(loginBtn, loginBtnText, loginBtnIcon, false, 'Sign In');
        }
    });

    // ─── Step 2: MFA verify ─────────────────────────────────
    mfaUseRecovery.addEventListener('click', () => {
        setRecoveryMode(!usingRecovery);
    });

    mfaBack.addEventListener('click', () => {
        mfaToken = null;
        showPasswordStep();
    });

    // Mode-aware sanitizer. No `pattern` attribute anywhere.
    mfaCodeInput.addEventListener('input', () => {
        if (usingRecovery) {
            // Recovery codes: keep only A–Z, 0–9 and dash; uppercase; strip doubled dashes.
            let v = mfaCodeInput.value
                .replace(/[^A-Za-z0-9-]/g, '')
                .toUpperCase()
                .replace(/-+/g, '-');
            mfaCodeInput.value = v.slice(0, 20);
        } else {
            // TOTP: digits only, max 6
            mfaCodeInput.value = mfaCodeInput.value.replace(/\D/g, '').slice(0, 6);
        }
        hideError();
    });

    mfaForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideError();

        const raw = (mfaCodeInput.value || '').trim();
        if (!raw) { showError(usingRecovery ? 'Enter a recovery code.' : 'Enter your 6-digit code.'); return; }

        if (!usingRecovery && !/^\d{6}$/.test(raw)) {
            showError('The authenticator code must be 6 digits.');
            return;
        }
        if (usingRecovery && !/^[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{2}$/.test(raw)) {
            showError('Recovery codes look like XXXX-XXXX-XX. Check the format and try again.');
            return;
        }

        setLoading(mfaBtn, mfaBtnText, mfaBtnIcon, true);

        try {
            const body = usingRecovery
                ? { mfa_token: mfaToken, recovery_code: raw }
                : { mfa_token: mfaToken, code: raw };

            const res = await fetch('/api/admin/login/mfa', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json().catch(() => ({}));

            if (!res.ok || !data.success) {
                const code = data.code || '';
                if (code === 'INVALID_MFA_TOKEN') {
                    throw new Error('Your verification session expired. Please sign in again.');
                }
                throw new Error(data.error || data.message || 'Verification failed');
            }

            stopCountdown();
            completeLogin(data.data);
        } catch (err) {
            showError(err.message || 'Verification failed. Try again.');
            setLoading(mfaBtn, mfaBtnText, mfaBtnIcon, false, 'Verify & Sign In');
        }
    });

    // ─── Finish login ───────────────────────────────────────
    function completeLogin(payload) {
        const { token, user, refreshToken } = payload || {};
        if (!token) { showError('Server did not return an authentication token'); return; }

        if (typeof window.AdminSession !== 'undefined' && window.AdminSession.save) {
            window.AdminSession.save(token, user, refreshToken);
        } else {
            localStorage.setItem('admin_sess', JSON.stringify({
                token,
                refreshToken: refreshToken || null,
                user: user || null,
                loggedAt: Date.now()
            }));
        }

        const dashboardUrl = payload?.dashboardUrl || '/admin/dashboard.html';
        setTimeout(() => window.location.replace(dashboardUrl), 150);
    }

    emailInput.addEventListener('input', hideError);
    passwordInput.addEventListener('input', hideError);

    // ─── Auto-redirect if already signed in ─────────────────
    setTimeout(() => {
        try {
            const raw = localStorage.getItem('admin_sess');
            if (!raw) return;
            const parsed = JSON.parse(raw);
            if (!parsed?.token) return;
            const parts = parsed.token.split('.');
            if (parts.length !== 3) return;
            let payload = parts[1].replace(/-/g, '+').replace(/_/g, '/');
            while (payload.length % 4) payload += '=';
            const decoded = JSON.parse(atob(payload));
            if (decoded.exp && decoded.exp * 1000 > Date.now()) {
                window.location.replace('/admin/dashboard.html');
            }
        } catch (_) {}
    }, 300);
})();
</script>
</body>
</html>
