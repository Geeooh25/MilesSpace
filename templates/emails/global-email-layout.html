<!-- global-email-layout.html -->
<!-- Reusable base layout for all MilesSpace emails -->

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MilesSpace</title>
    <style>
        /* ─── RESET ─── */
        body, table, td, a { 
            -webkit-text-size-adjust: 100%; 
            -ms-text-size-adjust: 100%; 
            margin: 0; 
            padding: 0; 
        }
        table, td { 
            mso-table-lspace: 0pt; 
            mso-table-rspace: 0pt; 
        }
        img { 
            -ms-interpolation-mode: bicubic; 
            border: 0; 
            height: auto; 
            line-height: 100%; 
            outline: none; 
            text-decoration: none; 
        }
        /* ─── OUTER TABLE ─── */
        .outer-table {
            width: 100%;
            background-color: #f4f6f8;
            padding: 20px 0;
        }
        /* ─── INNER CONTAINER ─── */
        .inner-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 8px;
            border: 1px solid #e4e8ec;
        }
        @media (max-width: 600px) {
            .inner-container {
                border-radius: 0;
                border-left: none;
                border-right: none;
            }
            .responsive-padding {
                padding: 16px 20px !important;
            }
            .btn-table {
                width: 100% !important;
            }
            .btn-td {
                display: block !important;
                width: 100% !important;
                text-align: center !important;
            }
            .stack {
                display: block !important;
                width: 100% !important;
                text-align: left !important;
                padding: 4px 0 !important;
            }
            .stack-right {
                text-align: left !important;
            }
            .hide-mobile {
                display: none !important;
            }
        }
        @media (max-width: 400px) {
            .responsive-padding {
                padding: 12px 16px !important;
            }
            .text-small {
                font-size: 13px !important;
            }
        }
        /* ─── BUTTON ─── */
        .btn-primary {
            background-color: #0c3d4a;
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
            font-weight: 600;
            padding: 12px 28px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary:hover {
            background-color: #155e72;
        }
        .btn-secondary {
            background-color: transparent;
            border: 1px solid #0c3d4a;
            border-radius: 6px;
            color: #0c3d4a;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;
            font-weight: 600;
            padding: 10px 24px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-secondary:hover {
            background-color: #f0f4f6;
        }
        /* ─── STATUS BADGE ─── */
        .status-success {
            color: #0b7e43;
            font-weight: 700;
        }
        .status-pending {
            color: #b45309;
            font-weight: 700;
        }
        .status-failed {
            color: #b91c1c;
            font-weight: 700;
        }
        /* ─── DIVIDER ─── */
        .divider {
            border: none;
            border-top: 1px solid #e4e8ec;
            margin: 20px 0;
        }
        .divider-thin {
            border: none;
            border-top: 1px solid #eef1f4;
            margin: 16px 0;
        }
    </style>
</head>
<body style="margin:0;padding:0;background-color:#f4f6f8;font-family:Arial,Helvetica,sans-serif;">

<!-- ─── OUTER TABLE ─── -->
<table class="outer-table" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f6f8;padding:20px 0;">
    <tr>
        <td align="center" style="padding:0 16px;">
            <!-- ─── INNER CONTAINER ─── -->
            <table class="inner-container" width="100%" max-width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;margin:0 auto;background-color:#ffffff;border-radius:8px;border:1px solid #e4e8ec;">
                <tr>
                    <td style="padding:32px 36px 24px;" class="responsive-padding">
                        
                        <!-- ─── HEADER ─── -->
                        <table width="100%" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                                <td align="left" style="padding-bottom:6px;">
                                    <a href="https://milesspace.com" style="text-decoration:none;color:#0c3d4a;font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;display:inline-flex;align-items:center;">
                                        <img src="https://milesspace.com/images/miles-logo.png" alt="MilesSpace" width="160" style="display:block;max-width:100%;height:auto;" />
                                    </a>
                                </td>
                            </tr>
                            <tr>
                                <td style="padding-bottom:4px;">
                                    <span style="font-size:13px;color:#6b7d8a;font-family:Arial,Helvetica,sans-serif;letter-spacing:0.3px;">
                                        Everything Digital. One Trusted Marketplace.
                                    </span>
                                </td>
                            </tr>
                            <tr>
                                <td style="padding-top:12px;">
                                    <hr class="divider" style="border:none;border-top:1px solid #e4e8ec;margin:0;">
                                </td>
                            </tr>
                        </table>

                        <!-- ─── CONTENT ─── -->
                        <!-- CONTENT GOES HERE -->

                    </td>
                </tr>
            </table>

            <!-- ─── FOOTER ─── -->
            <table width="100%" max-width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;margin:8px auto 0;">
                <tr>
                    <td style="padding:12px 16px;text-align:center;">
                        <p style="margin:0 0 4px;font-size:12px;color:#8fa3ab;font-family:Arial,Helvetica,sans-serif;">
                            <a href="https://milesspace.com" style="color:#0c3d4a;text-decoration:none;font-weight:600;">MilesSpace</a> &middot;
                            <a href="mailto:support@milesspace.com" style="color:#0c3d4a;text-decoration:none;">Support</a> &middot;
                            <a href="https://milesspace.com/terms" style="color:#0c3d4a;text-decoration:none;">Terms</a> &middot;
                            <a href="https://milesspace.com/privacy" style="color:#0c3d4a;text-decoration:none;">Privacy</a>
                        </p>
                        <p style="margin:4px 0 0;font-size:11px;color:#9aaeb8;font-family:Arial,Helvetica,sans-serif;">
                            &copy; 2026 MilesSpace. All rights reserved.
                        </p>
                        <p style="margin:4px 0 0;font-size:10px;color:#b0c3cc;font-family:Arial,Helvetica,sans-serif;">
                            This is an automated message. Please do not reply to this email.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>

</body>
</html>
