<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{subject}}</title>
</head>
<body style="font-family: 'DM Sans', Arial, sans-serif; background: #f4f6f8; padding: 40px 20px; margin: 0;">
    <div style="max-width: 520px; margin: 0 auto; background: #ffffff; border-radius: 16px; padding: 40px 32px; box-shadow: 0 4px 14px rgba(0,0,0,0.06);">
        <div style="text-align: center; margin-bottom: 28px;">
            <div style="font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px; color: #0c3d4a;">
                📦 MilesSpace
            </div>
            <p style="color: #4a6070; font-size: 14px; margin-top: 4px;">Order Status Update</p>
        </div>
        
        <h2 style="font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; color: #0c3d4a; margin-bottom: 12px;">
            Order Status Changed
        </h2>
        
        <p style="color: #4a6070; font-size: 15px; line-height: 1.6; margin-bottom: 20px;">
            Hello <strong>{{username}}</strong> 👋,<br><br>
            Your order status has been updated.
        </p>
        
        <div style="background: #f8f9fa; border-radius: 10px; padding: 16px 20px; margin-bottom: 24px;">
            <div style="display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #e4e8ec;">
                <span style="color: #4a6070; font-size: 13px;">Order ID</span>
                <span style="color: #0c3d4a; font-weight: 600; font-size: 12px; font-family: monospace;">#{{orderId}}</span>
            </div>
            <div style="display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #e4e8ec;">
                <span style="color: #4a6070; font-size: 13px;">Product</span>
                <span style="color: #0c3d4a; font-weight: 600; font-size: 13px;">{{productName}}</span>
            </div>
            <div style="display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #e4e8ec;">
                <span style="color: #4a6070; font-size: 13px;">Amount</span>
                <span style="color: #0c3d4a; font-weight: 600; font-size: 13px;">{{amount}}</span>
            </div>
            <div style="display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #e4e8ec;">
                <span style="color: #4a6070; font-size: 13px;">Previous Status</span>
                <span style="color: #4a6070; font-weight: 600; font-size: 13px;">{{oldStatus}}</span>
            </div>
            <div style="display: flex; justify-content: space-between; padding: 6px 0;">
                <span style="color: #4a6070; font-size: 13px;">New Status</span>
                <span style="color: #0c3d4a; font-weight: 700; font-size: 13px;">{{newStatus}}</span>
            </div>
        </div>
        
        <div style="text-align: center; margin-top: 16px;">
            <a href="https://milesspace.com/history" style="background: #0c3d4a; color: #fff; padding: 10px 24px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px; display: inline-block;">
                📋 View Order
            </a>
        </div>
        
        <div style="border-top: 1px solid #e4e8ec; padding-top: 20px; margin-top: 20px;">
            <p style="color: #92a8b4; font-size: 12px; text-align: center; margin: 0;">
                © 2024 MilesSpace. All rights reserved.
            </p>
        </div>
    </div>
</body>
</html>
